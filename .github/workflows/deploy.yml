name: CI and GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truthgrid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - run: npm ci
        working-directory: candidate

      - run: npm test
        working-directory: candidate

      - run: npx playwright install --with-deps chromium
        working-directory: candidate

      - run: npm run build
        working-directory: candidate

      - run: npm run test:pwa
        working-directory: candidate

      - run: npm run build
        working-directory: candidate
        env:
          GITHUB_PAGES: 'true'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name != 'pull_request'
        with:
          path: candidate/dist

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: npm ci
        working-directory: candidate

      - run: mkdir -p reports
        working-directory: candidate

      - name: Compare npm audit results with baseline
        run: node scripts/check-npm-audit.mjs .github/npm-audit-baseline.json . reports/npm-audit-comparison.json
        working-directory: candidate

      - name: Generate dependency SBOM and license inventory
        run: npx --yes --package=@cyclonedx/cyclonedx-npm@6.0.1 -- cyclonedx-npm --output-reproducible --output-file reports/dependency-sbom.json
        working-directory: candidate

      - name: Enforce dependency license policy
        run: node scripts/check-license-policy.mjs reports/dependency-sbom.json .github/license-policy.json
        working-directory: candidate

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-reports-${{ github.run_id }}
          path: candidate/reports/**
          if-no-files-found: warn
          retention-days: 14

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          fetch-depth: 0

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.BASELINE_REF != '' && env.BASELINE_REF != '0000000000000000000000000000000000000000'
        with:
          ref: ${{ env.BASELINE_REF }}
          path: baseline
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - run: npm ci
        if: env.BASELINE_REF != '' && env.BASELINE_REF != '0000000000000000000000000000000000000000'
        working-directory: baseline

      - run: npm run build
        if: env.BASELINE_REF != '' && env.BASELINE_REF != '0000000000000000000000000000000000000000'
        working-directory: baseline
        env:
          GITHUB_PAGES: 'true'

      - run: npm ci
        working-directory: candidate

      - run: npx playwright install --with-deps chromium
        working-directory: candidate

      - run: npm run build
        working-directory: candidate
        env:
          GITHUB_PAGES: 'true'

      - name: Compare Lighthouse runs with baseline
        run: node scripts/compare-lighthouse.mjs ../baseline reports/lighthouse
        working-directory: candidate

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: performance-reports-${{ github.run_id }}
          path: candidate/reports/lighthouse/**
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request'
    needs: [quality, security, performance]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
